  <section class="prijzen" id="prijzen" aria-labelledby="prijzen-titel">
    <div class="wrap">
      <header class="sectie-kop" data-reveal>
        <p class="eyebrow">{{t:prijzen.eyebrow}}</p>
        <h2 id="prijzen-titel">{{t:prijzen.h2}}</h2>
        <p class="sectie-sub">{{t:prijzen.sub}}</p>
      </header>
      <div class="plannen">
{{prijstabel}}
      </div>
      <div class="prijzen-voet">
        <p class="team">{{t:prijzen.team_tekst}} <a href="/teams/" data-cta="prijzen-teams">{{t:prijzen.team_link}}<svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></a></p>
        <p class="capaciteit">{{capaciteit}}</p>
        <p class="twijfel">{{t:prijzen.twijfel}} <a href="/gratis/" data-cta="prijzen-gratis">{{t:prijzen.twijfel_link}}</a></p>
        <p class="btw">{{t:prijzen.btw}}</p>
      </div>
    </div>
  </section>
